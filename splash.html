<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Roulette Analyzer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  .card {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 22px;
    background: radial-gradient(120% 120% at 50% 30%, #0d1424 0%, #05070d 70%);
    border: 1px solid rgba(56, 189, 210, 0.18);
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.55);
    -webkit-app-region: drag;
  }
  /* Вращающееся колесо-кольцо */
  .wheel {
    position: relative;
    width: 92px; height: 92px;
  }
  .ring {
    position: absolute; inset: 0;
    border-radius: 50%;
    border: 3px solid rgba(255, 255, 255, 0.06);
    border-top-color: #38d3d2;
    border-right-color: #38d3d2;
    animation: spin 1.1s cubic-bezier(0.55, 0.15, 0.35, 0.9) infinite;
  }
  .ring.inner {
    inset: 16px;
    border: 2px solid rgba(255, 255, 255, 0.05);
    border-bottom-color: #e0b34a;
    border-left-color: #e0b34a;
    animation: spin 1.6s linear infinite reverse;
  }
  .hub {
    position: absolute; inset: 34px;
    border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #1a2540, #0a0f1c);
    box-shadow: inset 0 0 8px rgba(56, 189, 210, 0.35);
    display: flex; align-items: center; justify-content: center;
    color: #38d3d2; font-weight: 700; font-size: 15px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .title {
    color: #eaf2f6; font-size: 17px; font-weight: 600; letter-spacing: 0.4px;
  }
  .title span { color: #38d3d2; }
  .sub {
    color: #6b7a90; font-size: 12px; letter-spacing: 0.3px;
  }
  .bar {
    width: 150px; height: 3px; border-radius: 3px;
    background: rgba(255, 255, 255, 0.07); overflow: hidden;
  }
  .bar i {
    display: block; height: 100%; width: 40%;
    border-radius: 3px;
    background: linear-gradient(90deg, transparent, #38d3d2, transparent);
    animation: slide 1.2s ease-in-out infinite;
  }
  @keyframes slide {
    0% { transform: translateX(-120%); }
    100% { transform: translateX(320%); }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="wheel">
      <div class="ring"></div>
      <div class="ring inner"></div>
      <div class="hub">RA</div>
    </div>
    <div class="title">Roulette <span>Analyzer</span></div>
    <div class="bar"><i></i></div>
    <div class="sub">Загрузка…</div>
  </div>
</body>
</html>
